[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "public-readiness"
version = "0.1.0"
description = "Evidence-driven repository public readiness scanner and lifecycle skill."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["black>=25,<27", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]

[tool.setuptools]
py-modules = []
