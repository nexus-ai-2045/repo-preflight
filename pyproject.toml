[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-preflight"
version = "0.5.1"
description = "Evidence-driven preflight scanner and lifecycle skill for repositories, run before widening who can see them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["black>=25,<27", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]

[tool.setuptools]
py-modules = []
