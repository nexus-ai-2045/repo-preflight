[build-system]
requires = [
    "setuptools>=84.0.0; python_version >= '3.10'",
    "setuptools>=77.0.3,<81; python_version < '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "repo-preflight"
version = "0.10.0"
description = "Evidence-driven preflight scanner and lifecycle skill for repositories, run before widening who can see them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
images = ["simplejpeg>=1.9,<2", "psd-tools>=1.26,<2"]
test = [
    "black>=26.10.1,<27; python_version >= '3.10'",
    "pytest>=9.1.1,<10; python_version >= '3.10'",
    "pytest>=8.4,<9; python_version < '3.10'",
    "pytest-xdist>=3.8,<4",
    "Pillow>=13,<14; python_version >= '3.10'",
    "Pillow>=11.3,<12; python_version < '3.10'",
    "simplejpeg>=1.9,<2",
    "psd-tools>=1.26,<2",
    "pyyaml>=6.0.3,<7",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py39"]

[tool.setuptools]
py-modules = []
