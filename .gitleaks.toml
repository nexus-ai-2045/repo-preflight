# 既定の規則を残したまま足す。useDefault が無いと既定の規則が 0 本になる。
title = "repo-preflight"

[extend]
useDefault = true

[[rules]]
id = "claude-session-trailer"
description = "開発道具のセッション行"
# レビュー3C 高7: 「:」の後ろが ID の形（数字を含む英数字の塊）のときだけ（identity_gate.SESSION_TRACE_RES と同じ形）
regex = '''(?i)(?:claude|codex|cursor|chatgpt|copilot)[\s_*-]*session(?:[\s_-]*id)?[\s*]*(?::|：)[\s*`'"]*[A-Za-z_-]*[0-9][A-Za-z0-9_-]*'''

[[rules]]
id = "claude-session-url"
description = "開発道具のセッションURL"
# レビュー3C 高2: claude.ai と claude.com の project・chat・share・code（ファイル名に写した形も）
regex = '''(?i)claude[.](?:ai|com)[/_](?:code[/_](?:session_|projects?[/_])|(?:projects?|chat|share|code)/[A-Za-z0-9_-])'''

[[rules]]
id = "ai-work-url"
description = "開発道具の作業URL（Codex・ChatGPT・Cursor）"
regex = '''(?i)(?:chatgpt[.]com|chat[.]openai[.]com)/(?:codex/tasks|c|share|g)/|cursor[.](?:com|sh)/(?:agents|background-agent|bc)[/?#]'''
