name: all-refs-scan

# PR・push の CI（preflight-gate.yml）は、そのイベントの commit から辿れる履歴だけを見る。
# その穴埋めとして、PR の無い枝・タグ・PR の head（refs/pull/*/head）も含めたリモートの ref を、
# 日に1回・手動・監査器や規則を変えたmainへのpushで検査する。取得するのは refs/heads・refs/tags・refs/pull/*/head だけで、
# refs/notes やそれ以外の名前空間（任意の refs/*、refs/pull/*/merge など）は取得せず、検査の対象外。
# 新しい検査は作らず、preflight-gate と同じ入口を ref ごとに呼ぶ。
# - 名義・本文・足した行の形：scripts/identity_gate.py --public（デフォルト枝に無い commit）
# - 秘密・個人パス・名義の件数：scripts/preflight_ratchet.py（基準値はデフォルト枝の版より緩められない）
# - 鍵：固定した gitleaks（全履歴）
# - 注釈付きタグ：タグの作者（tagger）と注釈文（入れ子のタグも）を identity_gate.check_pushed_tags で見る
# 許可名義の一覧と名義検査の例外一覧は、デフォルト枝の版（tool 側）だけを読む。枝側で広げても通らない。
# 書き込みはしない（Issue・コメントも作らない）。
# ログに出すのは件数と種類だけ。ref 名・ファイル名・作者名（commit の作者・タグの作者）・値は、
# 個人名が入りうるので出さない。ログの本文には commit やタグのハッシュ、デフォルト枝の名前も出さない
# （actions/checkout は枝の名前と SHA をログに出すので使わず、git の取得と checkout を自前で静かに行う。
# 実行の画面の見出しに GitHub 自身が出す、この実行の commit は別）。
# git を含む各検査の stdout・stderr は作業場のファイルにだけ書き、決まった文言か、
# 下の summarize.py が種類と件数に直したものだけを出す。どの ref かは、手元で同じ検査を回して確かめる。
# checkout はフィルタ（LFS を含む。外のコマンドを動かさない）とシンボリックリンクを切った専用の作業場で行い、
# git が何か出力した・失敗した ref は「checkout できない ref」として赤にし、残りの ref の検査は続ける。
# LFS のポインタは中身（LFS 側の大きいファイル）を検査できないので、ref の履歴（git rev-list --objects）にある
# ポインタの形をした小さい blob を数え、1件でもあれば赤として件数を出す（足してから消したものも数える）。

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # 監査器の修復は、その版で過去の公開refも確かめる。通常のdocs/test変更では起動しない。
  push:
    branches:
      - main
    paths:
      - ".github/workflows/all-refs-scan.yml"
      - "scripts/identity_gate.py"
      - "scripts/identity_normalization.py"
      - "scripts/preflight_ratchet.py"
      - "scripts/readiness_scan.py"
      - "scripts/readiness_scan_*.py"
      - "scripts/caff_archive.py"
      - "scripts/dialogue_gate.py"
      - "scripts/consistency_gate.py"
      - "scripts/readme_release_gate.py"
      - "scripts/install_pinned_gitleaks.py"
      - "scripts/ci_all_refs_scan.sh"
      - "references/public-commit-identities.json"
      - "references/gitleaks-pins.json"
      - ".repo-preflight/identity-fixture-exceptions.txt"
      - ".repo-preflight/reviewed-synthetic-fixtures.json"
      - ".repo-preflight/ratchet-baseline.json"
      - ".gitleaks.toml"

permissions:
  contents: read

concurrency:
  group: all-refs-scan
  cancel-in-progress: false

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      # 検査の版（例外一覧を含む）はデフォルト枝に限る。手動実行で別の枝を選んだときは赤にする。
      # 枝の名前は既定の環境変数（GITHUB_REF）で読み、env に展開した値をログに出さない。
      - name: Require default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch 2>/dev/null)" || {
            echo "デフォルト枝を読めません" >&2
            exit 1
          }
          test -n "$default_branch"
          if [ "$GITHUB_REF" != "refs/heads/${default_branch}" ]; then
            echo "all-refs-scan はデフォルト枝の版でだけ動かします" >&2
            exit 1
          fi
      # actions/checkout は取った枝の名前と完全な SHA をログに出し、全履歴なら取った ref を1行ずつ出す。
      # ここでは使わず、全部の枝・タグ・PR の head（refs/pull/*/head）を専用の名前空間 refs/all-refs/ へ
      # -q で取り、git の出力はすべてファイルへ捨てる。merge 用の ref は GitHub が作る合成物なので見ない。
      # 検査の版（tool）は、この実行の commit（GITHUB_SHA。デフォルト枝）を同じ手順で取り出す。
      - name: Fetch every branch, tag and pull request head quietly
        env:
          EVENT_FETCH_TOKEN: ${{ github.token }}
        run: |
          set +ax
          set -euo pipefail
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF GIT_TRACE_SETUP
          log="$(mktemp "${RUNNER_TEMP:-/tmp}/all-refs-fetch.XXXXXX")"
          fail() { echo "$1" >&2; exit 1; }
          token="${EVENT_FETCH_TOKEN:-}"
          unset EVENT_FETCH_TOKEN
          test -n "$token" || fail "取得用のトークンがありません"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 | tr -d '\r\n')"
          unset token
          git init -q target > "$log" 2>&1 || fail "取得の作業場を作れません"
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader" \
          GIT_CONFIG_VALUE_0="$auth_header" \
          GIT_CONFIG_KEY_1=credential.helper \
          GIT_CONFIG_VALUE_1= \
          GIT_TERMINAL_PROMPT=0 \
            git -C target fetch -q --no-tags --no-write-fetch-head "${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}" \
              '+refs/heads/*:refs/all-refs/heads/*' \
              '+refs/tags/*:refs/all-refs/tags/*' \
              '+refs/pull/*/head:refs/all-refs/pull/*' >> "$log" 2>&1 || {
            unset auth_header
            fail "全 ref を取得できません"
          }
          unset auth_header
          git -C target cat-file -e "${GITHUB_SHA}^{commit}" >> "$log" 2>&1 || fail "この実行の commit がありません"
          git init -q tool >> "$log" 2>&1 || fail "検査の版の作業場を作れません"
          git -C target update-ref refs/all-refs-scan/tool "$GITHUB_SHA" >> "$log" 2>&1 &&
            git -C tool fetch -q --no-tags --no-write-fetch-head "$PWD/target" refs/all-refs-scan/tool >> "$log" 2>&1 &&
            git -C target update-ref -d refs/all-refs-scan/tool >> "$log" 2>&1 &&
            GIT_LFS_SKIP_SMUDGE=1 git -C tool -c filter.lfs.process= -c filter.lfs.smudge=cat -c filter.lfs.required=false \
              -c advice.detachedHead=false checkout -q --detach "$GITHUB_SHA" >> "$log" 2>&1 ||
            fail "検査の版を取り出せません"
          test "$(git -C tool rev-parse HEAD 2>/dev/null)" = "$GITHUB_SHA" || fail "検査の版がこの実行の commit と違います"
          rm -f "$log"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # preflight-gate・ci と同じ固定版（references/gitleaks-pins.json の配布物ハッシュと本体ハッシュ）
      - name: Install pinned gitleaks
        run: python tool/scripts/install_pinned_gitleaks.py --dest "${{ runner.temp }}/gitleaks" --github-path
      - name: Scan every ref
        env:
          TARGET: target
          TOOL: tool
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash "$TOOL/scripts/ci_all_refs_scan.sh"
