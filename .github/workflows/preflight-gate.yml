name: preflight-gate

# 各リポジトリから 1 行で呼ぶ共通の CI ゲート（reusable workflow）。
# 呼び出し側の repository を全履歴で検査し、基準値ファイルとのラチェットで判定する。
# 導入手順は docs/publish-and-ci-gate.md。呼び出し側の必須チェック名は
# 「<呼び出し側の job id> / preflight」になる。

on:
  workflow_call:
    inputs:
      preflight-ref:
        description: repo-preflight の ref。uses の @ と同じ tag か commit SHA を渡す
        type: string
        default: main
      baseline:
        description: 呼び出し側 repository 内の基準値ファイル
        type: string
        default: .repo-preflight/ratchet-baseline.json
      python-version:
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      # 呼び出し側と repo-preflight を別の場所へ置き、検査対象の作業ツリーを汚さない
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
          fetch-depth: 0
      - name: Check out repo-preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: ${{ inputs.preflight-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run preflight ratchet
        env:
          BASELINE: ${{ inputs.baseline }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          BASE_BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail
          args=(--repo target --baseline "$BASELINE")
          if [ -n "$BASE_SHA" ]; then
            # readiness_scan.py の比較元は refs/remotes/origin/ 配下の名前しか受け付けない。
            # 生の SHA を渡すと invalid_consistency_base_ref で必ず tool_error になる。
            # fetch-depth: 0 の checkout が取得した origin/<比較先ブランチ> を渡す。
            args+=(--baseline-base-ref "$BASE_SHA" --consistency-base-ref "origin/${BASE_BRANCH#refs/heads/}")
          fi
          python tool/scripts/preflight_ratchet.py "${args[@]}"
