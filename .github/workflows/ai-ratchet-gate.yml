name: ai-ratchet-gate

# tracked ∧ ignored の新規矛盾を fail-closed で止める。
# 検査ロジックの正本は nexus-ai-2045/ai-ratchet-gate（GitHub Release wheel）。
# baseline に載っている既存分だけを見逃し、増える方向は deny する。

on:
  pull_request:
    branches:
      - "main"
  merge_group:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

permissions:
  contents: read

env:
  AI_RATCHET_GATE_WHEEL_PATH: vendor/ai_ratchet_gate-0.1.1-py3-none-any.whl
  AI_RATCHET_GATE_WHEEL_SHA256: b3f22ab772699d57906326e42189e0ab7a0ee9e33dcad55a90909ece35106cd7

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned ai-ratchet-gate wheel
        run: |
          set -euo pipefail
          # pip はファイル名からバージョンを読む。短縮名にすると Invalid wheel filename になる。
          WHEEL_PATH="$AI_RATCHET_GATE_WHEEL_PATH"
          test -f "$WHEEL_PATH"
          echo "${AI_RATCHET_GATE_WHEEL_SHA256}  ${WHEEL_PATH}" | sha256sum -c -
          python -m pip install --no-deps "$WHEEL_PATH"

      - name: Smoke-check installed CLI
        run: |
          set -euo pipefail
          python -m ai_ratchet_gate --help | grep -F "tracked∧ignored"
          ai-ratchet-gate --help | grep -F "tracked∧ignored"

      - name: Run ai-ratchet-gate (fail-closed)
        run: python -m ai_ratchet_gate --repo .
