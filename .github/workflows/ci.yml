name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  # ジョブ表示名は ruleset 必須チェック `test (3.11)` / `test (3.13)` と一致させる
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 一覧は include の形で書く。consistency_gate の Action 参照読み取り器は
        # jobs 内の流れ形式やスカラーの列を読まずに fail-closed にするため。
        include:
          - python-version: "3.11"
          - python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # 秘密情報検査の試験は本物の gitleaks を要る。preflight-gate と同じ固定版を、
      # references/gitleaks-pins.json の配布物ハッシュと本体ハッシュで確かめて入れる。
      - name: Install pinned gitleaks
        run: python scripts/install_pinned_gitleaks.py --dest "${{ runner.temp }}/gitleaks" --github-path
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install --require-hashes -r requirements-tools.txt
      - run: python -m ai_ratchet_gate --repo .
      # ファイル名の直書きにすると、新しく足した script / test が永久に対象外になる。
      # 実際 tests/test_session_timezone.py (#47) が未整形のまま main へ入った。
      - run: python -m black --check scripts/ tests/
      - run: python -m pytest -q -n auto
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .

  # Mac 保証用。ruleset 必須ではないが CI で毎回通す
  test-macos:
    name: test-macos (${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 一覧は include の形で書く。consistency_gate の Action 参照読み取り器は
        # jobs 内の流れ形式やスカラーの列を読まずに fail-closed にするため。
        include:
          - python-version: "3.11"
          - python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # 秘密情報検査の試験は本物の gitleaks を要る。preflight-gate と同じ固定版を、
      # references/gitleaks-pins.json の配布物ハッシュと本体ハッシュで確かめて入れる。
      - name: Install pinned gitleaks
        run: python scripts/install_pinned_gitleaks.py --dest "${{ runner.temp }}/gitleaks" --github-path
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install --require-hashes -r requirements-tools.txt
      - run: python -m ai_ratchet_gate --repo .
      - run: python -m pytest -q -n auto
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .

  # Mac 標準の Python 3.9 で検査とフックが動くことの保証。ruleset 必須ではない。
  # 保全した ai-ratchet-gate wheel と black は 3.11 以上が要るので、上のジョブで回す。
  test-py39:
    name: test-py39 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      # 秘密情報検査の試験は本物の gitleaks を要る。preflight-gate と同じ固定版を、
      # references/gitleaks-pins.json の配布物ハッシュと本体ハッシュで確かめて入れる。
      - name: Install pinned gitleaks
        run: python scripts/install_pinned_gitleaks.py --dest "${{ runner.temp }}/gitleaks" --github-path
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -n auto
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .

  test-windows:
    name: test-windows (3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # 秘密情報検査の試験は本物の gitleaks を要る。preflight-gate と同じ固定版を、
      # references/gitleaks-pins.json の配布物ハッシュと本体ハッシュで確かめて入れる。
      - name: Install pinned gitleaks
        run: python scripts/install_pinned_gitleaks.py --dest "${{ runner.temp }}/gitleaks" --github-path
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install --require-hashes -r requirements-tools.txt
      - run: python -m ai_ratchet_gate --repo .
      - run: python -m pytest -q -n auto
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .
