name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ジョブ表示名は ruleset 必須チェック `test (3.11)` / `test (3.13)` と一致させる
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m black --check scripts/readiness_scan.py scripts/consistency_gate.py tests/test_readiness_scan.py tests/test_consistency_gate.py
      - run: python -m pytest -q
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .

  # Mac 保証用。ruleset 必須ではないが CI で毎回通す
  test-macos:
    name: test-macos (${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .

  test-windows:
    name: test-windows (3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: runtime smoke (CLI + skill adapters)
        run: python scripts/runtime_smoke.py --repo .
