name: Documentation contract

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-contract:
    name: documentation-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: README readability gate
        run: python scripts/readme_release_gate.py --repo . --json
      # docs/pr-self-review.md は外部で生成された配布物。rules_version は本文の
      # sha256 先頭 16 桁なので、生成器を持たないこの repository でも手編集を
      # 検出できる。
      - name: PR self-review copy integrity
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          path = pathlib.Path("docs/pr-self-review.md")
          try:
              text = path.read_text(encoding="utf-8")
          except (OSError, UnicodeError) as exc:
              sys.exit(f"{path} unreadable as UTF-8: {exc}")
          declared = re.search(r"^\| rules_version \| `([0-9a-f]{16})` \|$", text, re.M)
          if declared is None:
              sys.exit(f"{path} has no rules_version row")
          start = text.find("\n## R1 ")
          if start < 0:
              sys.exit(f"{path} has no R1 section")
          actual = hashlib.sha256(text[start + 1 :].encode("utf-8")).hexdigest()[:16]
          if actual != declared.group(1):
              sys.exit(
                  f"{path} was edited by hand: it declares rules_version "
                  f"{declared.group(1)} but its body hashes to {actual}. "
                  "Regenerate it from nexus_ai scripts/export_pr_self_review.py."
              )
          print(f"{path} matches rules_version {actual}")
          PY
      - name: Documentation consistency gate
        env:
          CONSISTENCY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python scripts/consistency_gate.py --repo . --base-ref "$CONSISTENCY_BASE" --require-config --require-mode enforce --json
