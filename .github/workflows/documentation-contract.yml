name: Documentation contract

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'latest' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  documentation-contract:
    name: documentation-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[test]"
      - name: README readability gate
        run: python scripts/readme_release_gate.py --repo . --json
      # docs/pr-self-review.md は外部で生成された配布物。2 段で守る。
      #  (1) rules_version は本文 (## R1 以降) の sha256 先頭 16 桁。生成器を
      #      持たないこの repository でも本文の手編集を検出できる。
      #  (2) rules_version は前置き (frontmatter・題・出典・「手で編集しない」の
      #      警告) を覆わないので、完全ファイル digest を allowlist と突き合わせる。
      #      配布物の更新は allowlist の同時更新を要求する = 人間 review が挟まる。
      - name: PR self-review copy integrity
        run: python scripts/check_pr_self_review.py
      - name: Documentation consistency gate
        env:
          CONSISTENCY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python scripts/consistency_gate.py --repo . --base-ref "$CONSISTENCY_BASE" --require-config --require-mode enforce --json
      - name: Public narrative contract (CLI / REQUIRED / status / CI matrix)
        run: python -m pytest -q tests/test_public_narrative_contract.py
