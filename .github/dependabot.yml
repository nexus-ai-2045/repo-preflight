version: 2

updates:
  # Python の build / test 依存を、週次の人間レビュー可能な量で更新する。
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # requirements-tools.txt は同梱 wheel（./vendor/…）を --hash で固定した path 依存だけを持つ。
    # Dependabot は path 依存を取得できず update_files が毎回失敗するため、走査から外す。
    # この wheel の更新は人が release wheel と SHA-256 を差し替えて行う。
    exclude-paths:
      - "requirements-tools.txt"

  # full SHA へ固定した GitHub Actions の更新候補を追跡する。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # nexus-ai-2045 の自前 workflow・action（ai-ratchet-gate など）は固定先を人が上げるので、ここでは上げない。
    ignore:
      - dependency-name: "nexus-ai-2045/*"
